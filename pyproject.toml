[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustra-secaudit-workbench"
version = "0.1.0"
description = "Open-source rails for an AI/cybersecurity vulnerability audit workbench: evidence ledger, deterministic scan and match engine, risk rollup, entitlements, and reporting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Trustra" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
secaudit-workbench = "secaudit_workbench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secaudit_workbench = ["data/*.json"]
